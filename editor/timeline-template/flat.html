<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Timeline</title>
<link rel="stylesheet" href="flat.css" />
</head>
<body>

<div class="app">

  <header class="header">
    <div class="header__row">
      <div>
        <h1 class="header__title" id="title">Timeline</h1>
        <p class="header__subtitle" id="subtitle"></p>
      </div>
      <div class="header__controls">
        <label class="switch" id="thumbSwitch" hidden>
          <input type="checkbox" id="thumbToggle" checked />
          <span class="switch__track"><span class="switch__thumb"></span></span>
          <span class="switch__label">Show thumbnails</span>
        </label>
      </div>
    </div>
  </header>

  <main class="layout">

    <section class="chart-wrap">
      <div class="chart" id="chart">

        <!-- date gridlines + labels, injected by flat.js -->
        <div class="ticks" id="ticks"></div>

        <!-- the line itself -->
        <div class="axis" id="axis"></div>

        <!-- nodes injected by flat.js -->
        <div class="nodes" id="nodes"></div>

        <!-- category color legend, injected by flat.js -->
        <div class="legend" id="legend" hidden></div>

      </div>
    </section>

    <aside class="panel" id="panel">
      <div class="panel__empty" id="panelEmpty">
        <p>Select a point on the timeline to see its details here.</p>
      </div>

      <div class="panel__content" id="panelContent" hidden>
        <button class="panel__close" id="panelClose" aria-label="Close">&times;</button>
        <div class="panel__image-wrap" id="panelImageWrap" hidden>
          <img class="panel__image" id="panelImage" alt="" />
        </div>
        <div class="panel__date" id="panelDate"></div>
        <h2 class="panel__title" id="panelTitle"></h2>
        <div class="panel__category" id="panelCategory" hidden>
          <span class="panel__category-swatch" id="panelCategorySwatch"></span>
          <span id="panelCategoryName"></span>
        </div>
        <div class="panel__tags" id="panelTags"></div>
        <p class="panel__description" id="panelDescription"></p>
        <a class="panel__link" id="panelLink" href="#" target="_blank" rel="noopener">View project &rarr;</a>
      </div>
    </aside>

  </main>

</div>

<p class="error" id="error" hidden></p>

<script src="flat.js"></script>
</body>
</html>
